substitutions:
  name: sungoldpower-lfp
  friendly_name: "SunGoldPower LFP"
  uart_rx_pin: GPIO21
  relay_pin: GPIO16
  status_led_pin: GPIO23

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  use_address: 192.168.8.214
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

improv_serial:

esp32_improv:
  authorizer: none

logger:
  level: DEBUG

ota:
  - platform: esphome
    password: "!secret ota_password"

web_server:
  version: 3

light:
  - platform: status_led
    id: light_led
    name: LED
    pin:
      number: GPIO5
      inverted: true

uart:
  id: uart_bus
  rx_pin: ${uart_rx_pin}
  baud_rate: 2400
  debug:
    direction: RX
    dummy_receiver: true
    after:
      delimiter: "\r"
    sequence:
      - lambda: |-
          if (bytes.empty()) return;

          UARTDebug::log_string(direction, bytes, StringRef("RX: "));

          const std::string line(bytes.begin(), bytes.end());

          // Process Q1 Response
          // We use a leading space in sscanf to skip any leading \n or whitespace from previous packets
          float ip_v, ip_f_v, op_v, op_c, op_f, bat_v, temp;
          char bits[9]; // 8 bits + null terminator

          const int parsed = sscanf(line.c_str(), " (%f %f %f %f %f %f %f %8s", &ip_v, &ip_f_v, &op_v, &op_c, &op_f, &bat_v, &temp, bits);

          if (parsed == 8) {
            id(inv_ip_voltage).publish_state(ip_v);
            id(inv_ip_fault_voltage).publish_state(ip_f_v);
            id(inv_op_voltage).publish_state(op_v);
            id(inv_op_current).publish_state(op_c);
            id(inv_op_frequency).publish_state(op_f);
            id(inv_battery_voltage).publish_state(bat_v);
            id(inv_temperature).publish_state(temp);
            
            // Parse Status Bits
            id(stat_utility_fail).publish_state(bits[0] == '1');
            id(stat_battery_low).publish_state(bits[1] == '1');
            id(stat_avr_active).publish_state(bits[2] == '1');
            id(stat_ups_failed).publish_state(bits[3] == '1');
            id(stat_line_interactive).publish_state(bits[4] == '1');
            id(stat_test_progress).publish_state(bits[5] == '1');
            id(stat_shutdown_active).publish_state(bits[6] == '1');
            id(stat_beeper_on).publish_state(bits[7] == '1');
          }

switch:
  - platform: gpio
    pin: ${relay_pin}
    name: "Inverter Power Control"
    id: inverter_relay
    icon: "mdi:power-socket-us"

# Telemetry Sensors
sensor:
  - platform: template
    id: inv_ip_voltage
    name: "Input Voltage"
    unit_of_measurement: "V"
    device_class: voltage
  - platform: template
    id: inv_ip_fault_voltage
    name: "Input Fault Voltage"
    unit_of_measurement: "V"
    device_class: voltage
  - platform: template
    id: inv_op_voltage
    name: "Output Voltage"
    unit_of_measurement: "V"
    device_class: voltage
  - platform: template
    id: inv_op_current
    name: "Output Current"
    unit_of_measurement: "%"
    icon: "mdi:current-ac"
  - platform: template
    id: inv_op_frequency
    name: "Output Frequency"
    unit_of_measurement: "Hz"
    device_class: frequency
  - platform: template
    id: inv_battery_voltage
    name: "Battery Voltage"
    unit_of_measurement: "V"
    device_class: voltage
  - platform: template
    id: inv_temperature
    name: "Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    internal: true

# Status Binary Sensors
binary_sensor:
  - platform: template
    id: stat_utility_fail
    name: "Utility Fail"
    device_class: problem
  - platform: template
    id: stat_battery_low
    name: "Battery Low"
    device_class: battery
  - platform: template
    id: stat_avr_active
    name: "AVR Active"
    internal: true
  - platform: template
    id: stat_ups_failed
    name: "UPS Failed"
    device_class: problem
  - platform: template
    id: stat_line_interactive
    name: "Line Interactive Type"
  - platform: template
    id: stat_test_progress
    name: "Test in Progress"
  - platform: template
    id: stat_shutdown_active
    name: "Shutdown Active"
  - platform: template
    id: stat_beeper_on
    name: "Beeper On"
