substitutions:
  name: sungoldpower-lfp
  friendly_name: "SunGoldPower LFP"
  uart_rx_pin: GPIO21
  relay_pin: GPIO16
  status_led_pin: GPIO23

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

improv_serial:

esp32_improv:
  authorizer: none

logger:
  level: DEBUG

ota:
  - platform: esphome
    password: "!secret ota_password"

web_server:
  version: 3

light:
  - platform: status_led
    id: light_led
    name: LED
    icon: "mdi:led-on"
    pin:
      number: GPIO5
      inverted: true

external_components:
  - source:
      type: local
      path: components

uart:
  id: uart_bus
  rx_pin: ${uart_rx_pin}
  baud_rate: 2400
# Inverter Component
sungoldpower_lfp:
  id: inverter
  uart_id: uart_bus
  update_interval: 10s

switch:
  - platform: gpio
    pin: ${relay_pin}
    name: "Inverter Power Control"
    id: inverter_relay
    icon: "mdi:power"

# Telemetry Sensors
sensor:
  - platform: sungoldpower_lfp
    sungoldpower_lfp_id: inverter
    ip_voltage:
      name: "Input Voltage"
    ip_fault_voltage:
      name: "Input Fault Voltage"
    op_voltage:
      name: "Output Voltage"
    op_current:
      name: "Output Current"
    op_frequency:
      name: "Output Frequency"
    battery_voltage:
      name: "Battery Voltage"
    temperature:
      name: "Temperature"
      internal: true

# Status Binary Sensors
binary_sensor:
  - platform: sungoldpower_lfp
    sungoldpower_lfp_id: inverter
    utility_fail:
      name: "Utility Fail"
    battery_low:
      name: "Battery Low"
    avr_active:
      name: "AVR Active"
      internal: true
    ups_failed:
      name: "UPS Failed"
    line_interactive:
      name: "Line Interactive Type"
    test_progress:
      name: "Test in Progress"
    shutdown_active:
      name: "Shutdown Active"
    beeper_on:
      name: "Beeper On"
      internal: true
